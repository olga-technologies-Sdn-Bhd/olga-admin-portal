name: Deploy

# develop -> "dev" environment, main -> "production" environment.
# Each GitHub Environment holds its own variables and SWA deployment token.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    # Skips cleanly until the environment is configured in GitHub.
    if: ${{ vars.ADMIN_API_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - name: Write environment config
        run: node scripts/write-config.mjs
        env:
          ADMIN_ENVIRONMENT: ${{ vars.ADMIN_ENVIRONMENT }}
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
          ADMIN_AUTH_AUTHORITY: ${{ vars.ADMIN_AUTH_AUTHORITY }}
          ADMIN_AUTH_CLIENT_ID: ${{ vars.ADMIN_AUTH_CLIENT_ID }}
          ADMIN_AUTH_API_SCOPES: ${{ vars.ADMIN_AUTH_API_SCOPES }}
          ADMIN_AUTH_REQUIRED_ROLE: ${{ vars.ADMIN_AUTH_REQUIRED_ROLE }}
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
