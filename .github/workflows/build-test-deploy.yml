name: build-test-deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prd]

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Verify production deployment source
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prd' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deployments must run from the main branch."
          exit 1

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Save build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: admin-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.environment != 'prd' || github.ref == 'refs/heads/main'))
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Write environment config
        run: node scripts/write-config.mjs
        env:
          ADMIN_ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT == 'prd' && 'production' || 'dev' }}
          ADMIN_AUTH_MODE: ${{ env.DEPLOY_ENVIRONMENT == 'prd' && 'entra' || 'none' }}
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
          ADMIN_AUTH_AUTHORITY: ${{ vars.ADMIN_AUTH_AUTHORITY }}
          ADMIN_AUTH_CLIENT_ID: ${{ vars.ADMIN_AUTH_CLIENT_ID }}
          ADMIN_AUTH_API_SCOPES: ${{ vars.ADMIN_AUTH_API_SCOPES }}
          ADMIN_AUTH_REQUIRED_ROLE: ${{ vars.ADMIN_AUTH_REQUIRED_ROLE }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
          skip_deploy_on_missing_secrets: true

      - name: Write deployment summary
        run: |
          {
            echo "### Admin portal deployment"
            echo "- Environment: \`${DEPLOY_ENVIRONMENT}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
